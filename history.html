<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Transacciones</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo"><a href="dashboard.html">BANKO</a></div>
        <div>
            <a href="dashboard.html">Volver al Dashboard</a>
        </div>
    </nav>

    <div class="container">
        <h1 style="color: var(--color-primary); margin-bottom: 2rem;">Historial de Movimientos</h1>
        
        <div class="card" style="padding: 1rem;">
            <table class="transaction-table">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Descripción</th>
                        <th>Tipo</th>
                        <th>Monto</th>
                    </tr>
                </thead>
                <tbody id="historyTableBody">
                    </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const historyData = getHistory();
            const tableBody = document.getElementById('historyTableBody');
            
            if (historyData.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="4" style="text-align: center; opacity: 0.7; padding: 20px;">Aún no hay transacciones registradas.</td></tr>';
                return;
            }

            historyData.forEach(tx => {
                const amountValue = parseFloat(tx.amount);
                const isCredit = amountValue >= 0;
                const amountClass = isCredit ? 'credit' : 'debit';
                const sign = isCredit ? '+ ' : '- ';
                const displayAmount = Math.abs(amountValue).toFixed(2);
                
                const row = tableBody.insertRow();
                row.innerHTML = `
                    <td>${tx.date}</td>
                    <td>${tx.description}</td>
                    <td>${tx.type}</td>
                    <td class="${amountClass}">$ ${sign} ${displayAmount}</td>
                `;
            });
        });
    </script>
</body>
</html>
