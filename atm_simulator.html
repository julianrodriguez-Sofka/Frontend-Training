<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Cajero</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo"><a href="dashboard.html">BANKO</a></div>
        <div>
            <a href="dashboard.html">Volver al Dashboard</a>
        </div>
    </nav>

    <div class="container" style="max-width: 800px;">
        <h1 style="color: var(--color-primary); margin-bottom: 2rem; text-align: center;">Cajero Automático (ATM)</h1>

        <div class="balance-card" style="padding: 1.5rem; margin-bottom: 30px;">
            <h2 style="font-size: 1.1rem;">Tu Saldo Actual: 
                <span id="currentBalance" style="font-size: 1.8rem;">$ 12,345.50</span>
            </h2>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px;">

            <div class="card">
                <h3 style="color: var(--color-success); margin-bottom: 1.5rem;">Realizar Depósito</h3>
                <form id="depositForm"> 
                    <div class="form-group">
                        <label for="depositAmount">Monto a Depositar ($)</label>
                        <input type="number" id="depositAmount" required min="1.00" step="0.01" placeholder="Ej: 500.00">
                    </div>
                    <div class="form-group">
                        <label for="depositRef">Referencia (Opcional)</label>
                        <input type="text" id="depositRef" placeholder="Ej: Venta de artículo">
                    </div>
                    <button type="submit" class="btn btn-success" style="width: 100%;">
                        Depositar Dinero
                    </button>
                </form>
            </div>

            <div class="card">
                <h3 style="color: var(--color-danger); margin-bottom: 1.5rem;">Realizar Retiro</h3>
                <form id="withdrawForm"> 
                    <div class="form-group">
                        <label for="withdrawAmount">Monto a Retirar ($)</label>
                        <input type="number" id="withdrawAmount" required min="1.00" step="0.01" placeholder="Ej: 200.00">
                    </div>
                    <div class="form-group">
                        <label for="withdrawPin">PIN de Seguridad</label>
                        <input type="password" id="withdrawPin" required placeholder="Tu PIN">
                    </div>
                    <button type="submit" class="btn btn-danger" style="width: 100%;">
                        Retirar Dinero
                    </button>
                </form>
            </div>
            
        </div>
    </div>
    
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('currentBalance').innerText = `$ ${getBalance().toFixed(2)}`;

            document.getElementById('depositForm').addEventListener('submit', (e) => {
                e.preventDefault();
                
                const amount = parseFloat(document.getElementById('depositAmount').value);
                
                if (amount > 0) {
                    const newBalance = handleDeposit(amount);
                    animateBalanceChange('currentBalance', newBalance); 
                    showAlert('Depósito realizado con éxito.', true);
                    document.getElementById('depositAmount').value = '';
                } else {
                    showAlert('El monto del depósito debe ser mayor a cero.', false);
                }
            });

            document.getElementById('withdrawForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const amount = parseFloat(document.getElementById('withdrawAmount').value);
                const pin = document.getElementById('withdrawPin').value; 
                
                if (amount > 0) {
                    const result = handleWithdrawal(amount);

                    if (result.success) {
                        animateBalanceChange('currentBalance', result.newBalance);
                        showAlert('Retiro realizado con éxito.', true);
                    } else {
                       
                        showAlert(result.message, false);
                    }
                    
                    document.getElementById('withdrawAmount').value = '';
                    document.getElementById('withdrawPin').value = '';
                } else {
                    showAlert('El monto del retiro debe ser mayor a cero.', false);
                }
            });
        });
    </script>
</body>
</html>
