<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo"><a href="index.html">Management Bank</a></div>
        <div>
            <a href="dashboard.html">Iniciar Sesión</a>
        </div>
    </nav>

    <div class="container" style="max-width: 500px;">
        <div class="card">
            <h2 style="color: var(--color-primary); margin-bottom: 1.5rem;">Crea tu Cuenta Bancaria</h2>
            <form>
                <div class="form-group">
                    <label for="dni">DNI / Identificación</label>
                    <input type="text" id="dni" required placeholder="Ej: 12345678X">
                </div>
                <div class="form-group">
                    <label for="username">Nombre de Usuario</label>
                    <input type="text" id="username" required placeholder="Ej: JulianR">
                </div>
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" required placeholder="ejemplo@correo.com">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="Mínimo 8 caracteres">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    Registrarse y Abrir Cuenta
                </button>
            </form>
        </div>
    </div>
</body>
</html>
