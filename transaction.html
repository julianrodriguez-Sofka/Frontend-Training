<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realizar Transacción</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo"><a href="dashboard.html">Management Bank</a></div>
        <div>
            <a href="dashboard.html">Volver al Dashboard</a>
        </div>
    </nav>

    <div class="container" style="max-width: 600px;">
        <div class="card">
            <h2 style="color: var(--color-primary); margin-bottom: 1.5rem;">Transferencia a Terceros</h2>
            <form>
                <div class="form-group">
                    <label for="recipientDni">DNI del Destinatario</label>
                    <input type="text" id="recipientDni" required placeholder="Identificación del beneficiario">
                </div>
                <div class="form-group">
                    <label for="accountNumber">Número de Cuenta Destino</label>
                    <input type="text" id="accountNumber" required placeholder="Ej: 001-987-654-3">
                </div>
                <div class="form-group">
                    <label for="amount">Monto a Transferir ($)</label>
                    <input type="number" id="amount" required min="1.00" step="0.01" placeholder="Ej: 500.00">
                </div>
                <div class="form-group">
                    <label for="description">Concepto/Descripción</label>
                    <input type="text" id="description" placeholder="Ej: Pago de renta">
                </div>
                <button type="submit" class="btn btn-success" style="width: 100%;">
                    Confirmar Transacción
                </button>
            </form>
        </div>
    </div>
</body>
</html>
