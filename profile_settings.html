<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración de Perfil</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo"><a href="dashboard.html">Management Bank</a></div>
        <div>
            <a href="dashboard.html">Volver al Dashboard</a>
        </div>
    </nav>

    <div class="container" style="max-width: 600px;">
        <h1 style="color: var(--color-primary); margin-bottom: 2rem; text-align: center;">Configuración de Perfil</h1>
        
        <div class="card">
            <h2 style="margin-bottom: 1.5rem; border-bottom: 2px solid #ccc; padding-bottom: 0.5rem;">Información Personal</h2>
            <form>
                
                <div class="form-group">
                    <label for="userId">ID de Usuario (Solo Lectura)</label>
                    <input type="text" id="userId" value="TEST_ID_1" disabled style="background-color: #f0f0f0; cursor: not-allowed;">
                </div>

                <div class="form-group">
                    <label for="dni">DNI / Identificación</label>
                    <input type="text" id="dni" value="98765432Y" required>
                </div>

                <div class="form-group">
                    <label for="username">Nombre de Usuario</label>
                    <input type="text" id="username" value="NewName" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" value="test@bank.com" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    Guardar Cambios en Perfil
                </button>
            </form>
        </div>

        <div class="card" style="margin-top: 30px;">
            <h2 style="margin-bottom: 1.5rem; color: var(--color-danger); border-bottom: 2px solid var(--color-danger); padding-bottom: 0.5rem;">Cambiar Contraseña</h2>
            <form>
                <div class="form-group">
                    <label for="currentPassword">Contraseña Actual</label>
                    <input type="password" id="currentPassword" required>
                </div>
                <div class="form-group">
                    <label for="newPassword">Nueva Contraseña</label>
                    <input type="password" id="newPassword" required>
                </div>
                <div class="form-group">
                    <label for="confirmNewPassword">Confirmar Nueva Contraseña</label>
                    <input type="password" id="confirmNewPassword" required>
                </div>

                <button type="submit" class="btn btn-danger" style="width: 100%;">
                    Actualizar Contraseña
                </button>
            </form>
        </div>
    </div>
</body>
</html>
