<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo"><a href="/">BANKO</a></div> 
        <div>
            <a href="/register">Registrarse</a>
        </div>
    </nav>

    <div class="container" style="max-width: 400px;">
        <div class="card">
            <h2 style="color: var(--color-primary); margin-bottom: 1.5rem;">Acceso a Clientes</h2>
            
            <div id="message-container" style="margin-bottom: 15px;"></div>

            <!-- ✅ FORMULARIO DE LOGIN -->
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" required placeholder="tu.correo@banco.com">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required placeholder="Tu contraseña">
                </div>
                <button type="submit" id="loginButton" class="btn btn-primary" style="width: 100%;">
                    Iniciar Sesión
                </button>
            </form>

            <p style="margin-top: 1rem; text-align: center; font-size: 0.9rem;">
                ¿Aún no tienes cuenta? <a href="/register" style="color: var(--color-secondary);">Regístrate aquí</a>
            </p>
        </div>
    </div>

    <!-- ✅ MOSTRAR MENSAJES (DESDE PARAMS) -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const msgContainer = document.getElementById('message-container');
            let message = '';
            let isError = false;

            if (params.has('success')) {
                message = params.get('success').replace(/_/g, ' ');
            } else if (params.has('error')) {
                message = params.get('error').replace(/_/g, ' ');
                isError = true;
            } else if (params.has('message')) {
                message = params.get('message').replace(/_/g, ' ');
            }

            if (message) {
                const alertClass = isError ? 'alert-error' : 'alert-success';
                msgContainer.innerHTML = `<div class="alert ${alertClass}">${message}</div>`;
            }
        });
    </script>

    <!-- ✅ CONEXIÓN CON BACKEND Y LOGIN REAL -->
    <script>
        const API_BASE_URL = 'http://localhost:8080/api';

        async function apiRequest(endpoint, options = {}) {
            const url = `${API_BASE_URL}${endpoint}`;
            const response = await fetch(url, {
                headers: { 'Content-Type': 'application/json' },
                ...options,
            });

            if (!response.ok) {
                const text = await response.text();
                throw new Error(text || `Error HTTP ${response.status}`);
            }
            return response.json();
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const btn = document.getElementById('loginButton');
            const msgContainer = document.getElementById('message-container');

            // 🔹 Mostrar mensaje de "procesando..."
            btn.disabled = true;
            btn.textContent = 'Iniciando sesión...';
            msgContainer.innerHTML = '';

            try {
                // 🔹 Obtenemos todos los usuarios desde el backend
                const users = await apiRequest('/users');
                const user = users.find(u => u.email === email);

                if (!user) {
                    msgContainer.innerHTML = `<div class="alert alert-error">❌ Usuario no encontrado.</div>`;
                    btn.disabled = false;
                    btn.textContent = 'Iniciar Sesión';
                    return;
                }

                // 🔹 Verificamos contraseña simple (por ahora sin cifrado)
                if (user.password !== password) {
                    msgContainer.innerHTML = `<div class="alert alert-error">❌ Contraseña incorrecta.</div>`;
                    btn.disabled = false;
                    btn.textContent = 'Iniciar Sesión';
                    return;
                }

                // 🔹 Guardamos el usuario completo y su ID en sessionStorage
                sessionStorage.setItem('user', JSON.stringify(user));
                sessionStorage.setItem('userId', user.id); // ✅ Nueva línea

                // 🔹 Redirigimos al dashboard
                window.location.href = '/dashboard';
            } catch (error) {
                console.error('💥 Error en login:', error);
                msgContainer.innerHTML = `<div class="alert alert-error">⚠️ Error al conectar con el servidor.</div>`;
                btn.disabled = false;
                btn.textContent = 'Iniciar Sesión';
            }
        });
    </script>
</body>
</html>
