<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Cajero</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo"><a href="/dashboard">BANKO</a></div>
        <div>
            <a href="/dashboard">Volver al Dashboard</a>
        </div>
    </nav>

    <div class="container" style="max-width: 800px;">
        <h1 style="color: var(--color-primary); margin-bottom: 2rem; text-align: center;">Cajero Automático (ATM)</h1>

        <div class="balance-card" style="padding: 1.5rem; margin-bottom: 30px;">
            <h2 style="font-size: 1.1rem;">Tu Saldo Actual: 
                <span id="currentBalance" style="font-size: 1.8rem;">$ 12,345.50</span>
            </h2>
             <div id="message-container" style="margin-top: 15px;"></div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px;">

            <div class="card">
                <h3 style="color: var(--color-success); margin-bottom: 1.5rem;">Realizar Depósito</h3>
                <form action="/transaction" method="POST"> 
                    
                    <input type="hidden" name="accountId" value="123456789"> 
                    <input type="hidden" name="type" value="deposit"> 

                    <div class="form-group">
                        <label for="depositAmount">Monto a Depositar ($)</label>
                        <input type="number" id="depositAmount" name="amount" required min="1.00" step="0.01" placeholder="Ej: 500.00">
                    </div>
                    <div class="form-group">
                        <label for="depositRef">Referencia (Opcional)</label>
                        <input type="text" id="depositRef" placeholder="Ej: Venta de artículo">
                    </div>
                    <button type="submit" class="btn btn-success" style="width: 100%;">
                        Depositar Dinero
                    </button>
                </form>
            </div>

            <div class="card">
                <h3 style="color: var(--color-danger); margin-bottom: 1.5rem;">Realizar Retiro</h3>
                <form action="/transaction" method="POST"> 
                    
                    <input type="hidden" name="accountId" value="123456789"> 
                    <input type="hidden" name="type" value="withdrawal"> 

                    <div class="form-group">
                        <label for="withdrawAmount">Monto a Retirar ($)</label>
                        <input type="number" id="withdrawAmount" name="amount" required min="1.00" step="0.01" placeholder="Ej: 200.00">
                    </div>
                    <div class="form-group">
                        <label for="withdrawPin">PIN de Seguridad</label>
                        <input type="password" id="withdrawPin" required placeholder="Tu PIN">
                    </div>
                    <button type="submit" class="btn btn-danger" style="width: 100%;">
                        Retirar Dinero
                    </button>
                </form>
            </div>
            
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const msgContainer = document.getElementById('message-container');
            
            // Lógica para capturar mensajes de la API
            if (params.has('success') || params.has('error')) {
                const isError = params.has('error');
                const message = params.get(isError ? 'error' : 'success').replace(/_/g, ' ');
                const alertClass = isError ? 'alert-error' : 'alert-success';

                msgContainer.innerHTML = `<div class="alert ${alertClass}">${message}</div>`;
                
                // Limpiamos los parámetros de la URL después de mostrarlos si quieres evitar que se muestren de nuevo al recargar
                // history.replaceState(null, null, window.location.pathname);
            }
        });
    </script>
</body>
</html>
