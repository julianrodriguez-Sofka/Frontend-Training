<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configuración de Perfil</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      background-color: #f5f7fa;
      font-family: 'Segoe UI', sans-serif;
    }

    .profile-container {
      max-width: 500px;
      margin: 4rem auto;
      background: white;
      border-radius: 20px;
      padding: 2.5rem 2.5rem 3.5rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      position: relative;
    }

    h2 {
      color: #0066ff;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-weight: 600;
      margin-top: 1rem;
      color: #333;
    }

    input {
      width: 100%;
      padding: 0.7rem;
      margin-top: 0.4rem;
      border: 1px solid #ddd;
      border-radius: 10px;
      transition: all 0.2s ease;
      font-size: 1rem;
    }

    input:focus {
      border-color: #0066ff;
      outline: none;
      box-shadow: 0 0 4px #a5c8ff;
    }

    input[readonly] {
      background-color: #f0f4ff;
    }

    button {
      margin-top: 2rem;
      width: 100%;
      background-color: #0066ff;
      color: white;
      font-weight: 600;
      padding: 0.9rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      font-size: 1rem;
    }

    button:hover {
      background-color: #004ecc;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 1rem;
      color: #0066ff;
      text-decoration: none;
      font-weight: 500;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    /* ✅ Mensajes de notificación UX/UI */
    .notification {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      min-width: 80%;
      padding: 0.9rem 1.2rem;
      border-radius: 10px;
      font-weight: 500;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: all 0.4s ease;
    }

    .notification.show {
      top: -10px;
      opacity: 1;
      pointer-events: all;
    }

    .notification.success {
      background-color: #d1f2e6;
      color: #1a7f50;
      box-shadow: 0 2px 10px rgba(26, 127, 80, 0.2);
    }

    .notification.error {
      background-color: #fde1e1;
      color: #c62828;
      box-shadow: 0 2px 10px rgba(198, 40, 40, 0.2);
    }
  </style>
</head>
<body>
  <div class="profile-container">
    <div id="notification" class="notification"></div>

    <h2>Configuración de Perfil</h2>
    <form id="profileForm">
      <label for="id">ID de Usuario (Solo Lectura)</label>
      <input type="text" id="id" readonly />

      <label for="dni">DNI / Identificación</label>
      <input type="text" id="dni" />

      <label for="username">Nombre de Usuario</label>
      <input type="text" id="username" />

      <label for="email">Correo Electrónico</label>
      <input type="email" id="email" />

      <label for="password">Nueva Contraseña (opcional)</label>
      <input type="password" id="password" placeholder="********" />

      <button type="submit">Guardar Cambios</button>
    </form>

    <a href="dashboard.html" class="back-link">⬅ Volver al Panel</a>
  </div>

  <script>
    const API_BASE_URL = 'http://localhost:8080/api';
    const notification = document.getElementById('notification');

    function showNotification(message, type = 'success') {
      notification.textContent = message;
      notification.className = `notification ${type} show`;

      setTimeout(() => {
        notification.classList.remove('show');
      }, 3500);
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const user = JSON.parse(sessionStorage.getItem('user'));

      if (!user) {
        showNotification('⚠ Sesión expirada. Redirigiendo...', 'error');
        setTimeout(() => (window.location.href = 'login.html'), 2000);
        return;
      }

      document.getElementById('id').value = user.id || '';
      document.getElementById('dni').value = user.dni || '';
      document.getElementById('username').value = user.username || '';
      document.getElementById('email').value = user.email || '';

      document.getElementById('profileForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const updatedUser = {
          id: user.id,
          dni: document.getElementById('dni').value,
          username: document.getElementById('username').value,
          email: document.getElementById('email').value,
          password: document.getElementById('password').value || null,
        };

        try {
          const response = await fetch(`${API_BASE_URL}/users/update`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(updatedUser),
          });

          if (response.ok) {
            const result = await response.json();
            sessionStorage.setItem('user', JSON.stringify(result));
            showNotification('✅ Perfil actualizado correctamente.', 'success');
            setTimeout(() => (window.location.href = 'dashboard.html'), 2000);
          } else {
            const errorText = await response.text();
            showNotification('❌ Error: ' + (errorText || 'No se pudo actualizar el perfil.'), 'error');
          }
        } catch (error) {
          showNotification('⚠ Error de conexión con el servidor.', 'error');
          console.error(error);
        }
      });
    });
  </script>
</body>
</html>
