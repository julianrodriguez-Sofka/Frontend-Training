<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo"><a href="/">BANKO</a></div>
        <div>
            <a href="/login">Iniciar Sesión</a>
        </div>
    </nav>

    <div class="container" style="max-width: 500px;">
        <div class="card">
            <h2 style="color: var(--color-primary); margin-bottom: 1.5rem;">Crea tu Cuenta Bancaria</h2>
            
            <div id="message-container" style="margin-bottom: 15px;"></div>

            <form action="/register" method="POST">
                <div class="form-group">
                    <label for="dni">DNI / Identificación</label>
                    <input type="text" id="dni" name="dni" required placeholder="Ej: 12345678X">
                </div>
                <div class="form-group">
                    <label for="username">Nombre de Usuario</label>
                    <input type="text" id="username" name="username" required placeholder="Ej: JulianR">
                </div>
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" required placeholder="ejemplo@correo.com">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required placeholder="Mínimo 8 caracteres">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    Registrarse y Abrir Cuenta
                </button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const msgContainer = document.getElementById('message-container');
            
            // Lógica para capturar errores de la API (ej: DNI o Email ya existen)
            if (params.has('error')) {
                const message = params.get('error').replace(/_/g, ' ');
                // Asume que tu styles.css tiene la clase 'alert-error'
                msgContainer.innerHTML = `<div class="alert alert-error">${message}</div>`;
            }
        });
    </script>
</body>
</html>
