<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo"><a href="index.html">Management Bank</a></div>
        <div>
            <a href="register.html">Registrarse</a>
        </div>
    </nav>

    <div class="container" style="max-width: 400px;">
        <div class="card">
            <h2 style="color: var(--color-primary); margin-bottom: 1.5rem;">Acceso a Clientes</h2>
            <form action="dashboard.html">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" required placeholder="tu.correo@banco.com">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="Tu contraseña">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    Iniciar Sesión
                </button>
            </form>
            <p style="margin-top: 1rem; text-align: center; font-size: 0.9rem;">
                ¿Aún no tienes cuenta? <a href="register.html" style="color: var(--color-secondary);">Regístrate aquí</a>
            </p>
        </div>
    </div>
</body>
</html>
